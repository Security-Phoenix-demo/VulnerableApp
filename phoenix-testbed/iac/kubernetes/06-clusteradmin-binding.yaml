# INTENTIONALLY VULNERABLE — Phoenix correlation test fixture. NOT deployable manifest.
#
# TARGET: PHX-IAC-COMB-008 "ServiceAccount cluster-admin + automountServiceAccountToken + no PSP"
#   = propertyMatch `cluster-admin` (KEYLESS) + absentResourceType PodSecurityPolicy
#
# EXPECTED TO FIRE — and it is the ONLY Kubernetes rule here that is expected to. Its propertyMatch
# has no `=`, so IacToxicCombinationEngine takes the keyless branch, which searches ALL property
# text for the keyword rather than one top-level key. That is why `cluster-admin` matches where
# `privileged=true` (COMB-001) and `hostPath=/` (COMB-005) cannot: the keyless form is
# nesting-agnostic by construction.
#
# DO NOT ADD a PodSecurityPolicy anywhere in this repository — it satisfies this rule's absence
# component and switches the fixture off.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: phx-testbed-admin-sa
  namespace: default
# Default is true; stated explicitly so the manifest is self-describing.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: phx-testbed-admin-binding
subjects:
  - kind: ServiceAccount
    name: phx-testbed-admin-sa
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # The keyword the keyless propertyMatch searches for.
  name: cluster-admin
