<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
  <title id="title">VulnerableApp Threat Modelling Architecture</title>
  <desc id="desc">Architecture diagram for the VulnerableApp lab application showing clients, facade, vulnerable application containers, Spring Boot backend, vulnerable modules, H2 database, filesystem, external callback targets, and threat modelling outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #333; }
      .label { font: 700 16px Arial, sans-serif; fill: #111; }
      .small { font: 400 13px Arial, sans-serif; fill: #222; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #333; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; rx: 10; }
      .client { fill: #f5f7ff; stroke: #3c5ccf; }
      .edge { fill: #fffaf0; stroke: #c27a00; }
      .app { fill: #f1fff5; stroke: #138a36; }
      .data { fill: #fff4f4; stroke: #c42828; }
      .external { fill: #f7f7f7; stroke: #555; stroke-dasharray: 6 4; }
      .tm { fill: #f7f0ff; stroke: #7b2cbf; }
      .boundary { fill: none; stroke: #666; stroke-width: 1.5; stroke-dasharray: 8 5; rx: 16; }
      .boundaryLabel { font: 700 14px Arial, sans-serif; fill: #555; }
      .arrow { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .risk { font: 700 12px Arial, sans-serif; fill: #a00000; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="950" fill="#ffffff"/>
  <text x="40" y="48" class="title">VulnerableApp Architecture for Threat Modelling</text>
  <text x="40" y="74" class="subtitle">Deliberately vulnerable lab application: scanner/discovery endpoints, vulnerable modules, H2 database, runtime/file/network attack surfaces.</text>

  <!-- Trust boundaries -->
  <rect x="30" y="105" width="250" height="240" class="boundary"/>
  <text x="48" y="128" class="boundaryLabel">Untrusted client zone</text>

  <rect x="330" y="105" width="260" height="240" class="boundary"/>
  <text x="348" y="128" class="boundaryLabel">Facade / edge zone</text>

  <rect x="640" y="105" width="400" height="515" class="boundary"/>
  <text x="658" y="128" class="boundaryLabel">Application runtime zone</text>

  <rect x="1085" y="105" width="270" height="515" class="boundary"/>
  <text x="1103" y="128" class="boundaryLabel">Data, runtime and external zone</text>

  <rect x="40" y="680" width="1300" height="220" class="boundary"/>
  <text x="58" y="704" class="boundaryLabel">Threat modelling / ASPM context output</text>

  <!-- Client zone -->
  <rect x="70" y="160" width="170" height="58" class="box client"/>
  <text x="92" y="184" class="label">Browser</text>
  <text x="92" y="204" class="small">Manual tester</text>

  <rect x="70" y="250" width="170" height="58" class="box client"/>
  <text x="92" y="274" class="label">Scanner</text>
  <text x="92" y="294" class="small">DAST / Burp / ZAP</text>

  <!-- Facade -->
  <rect x="365" y="178" width="190" height="86" class="box edge"/>
  <text x="394" y="203" class="label">VulnerableApp</text>
  <text x="410" y="224" class="label">Facade</text>
  <text x="389" y="246" class="small">Nginx + React UI</text>

  <rect x="380" y="286" width="160" height="40" class="box edge"/>
  <text x="406" y="311" class="small">Port 80 / localhost</text>

  <!-- Application runtime -->
  <rect x="680" y="150" width="315" height="84" class="box app"/>
  <text x="710" y="177" class="label">Spring Boot Base App</text>
  <text x="710" y="198" class="small">Java 8 / /VulnerableApp</text>
  <text x="710" y="216" class="tiny">Port 9090 in standalone mode</text>

  <rect x="680" y="270" width="150" height="65" class="box app"/>
  <text x="706" y="295" class="label">JSP App</text>
  <text x="702" y="316" class="small">Vulnerable container</text>

  <rect x="845" y="270" width="150" height="65" class="box app"/>
  <text x="872" y="295" class="label">PHP App</text>
  <text x="867" y="316" class="small">Vulnerable container</text>

  <rect x="680" y="370" width="315" height="88" class="box app"/>
  <text x="706" y="396" class="label">REST Discovery APIs</text>
  <text x="706" y="417" class="small">/allEndPointJson, /scanner</text>
  <text x="706" y="436" class="small">/VulnerabilityDefinitions, /sitemap.xml</text>

  <rect x="680" y="500" width="315" height="90" class="box app"/>
  <text x="706" y="526" class="label">Vulnerability Modules</text>
  <text x="706" y="548" class="small">SQLi, XSS, SSRF, XXE, JWT</text>
  <text x="706" y="568" class="small">Upload, traversal, command injection</text>

  <!-- Data/external -->
  <rect x="1125" y="145" width="185" height="74" class="box data"/>
  <text x="1167" y="171" class="label">H2 DB</text>
  <text x="1151" y="192" class="small">In-memory seed data</text>
  <text x="1151" y="210" class="tiny">/h2 console: lab only</text>

  <rect x="1125" y="255" width="185" height="74" class="box data"/>
  <text x="1153" y="281" class="label">Filesystem</text>
  <text x="1151" y="302" class="small">Uploads / paths</text>
  <text x="1151" y="320" class="tiny">Traversal and write/read risks</text>

  <rect x="1125" y="365" width="185" height="74" class="box data"/>
  <text x="1152" y="391" class="label">OS Runtime</text>
  <text x="1151" y="412" class="small">Command execution surface</text>
  <text x="1151" y="430" class="tiny">Container escape risk to validate</text>

  <rect x="1125" y="475" width="185" height="74" class="box external"/>
  <text x="1154" y="501" class="label">External URLs</text>
  <text x="1151" y="522" class="small">SSRF / XXE / redirects</text>
  <text x="1151" y="540" class="tiny">Outbound trust boundary</text>

  <!-- TM outputs -->
  <rect x="80" y="735" width="245" height="105" class="box tm"/>
  <text x="110" y="762" class="label">Architecture Artifacts</text>
  <text x="110" y="784" class="small">architecture.md</text>
  <text x="110" y="804" class="small">architecture.svg</text>
  <text x="110" y="824" class="small">code-derived app description</text>

  <rect x="390" y="735" width="245" height="105" class="box tm"/>
  <text x="418" y="762" class="label">DFD + Boundaries</text>
  <text x="418" y="784" class="small">Components, stores, flows</text>
  <text x="418" y="804" class="small">Trust zones and assumptions</text>
  <text x="418" y="824" class="small">Confirmed-DFD input</text>

  <rect x="700" y="735" width="245" height="105" class="box tm"/>
  <text x="728" y="762" class="label">STRIDE Threats</text>
  <text x="728" y="784" class="small">Spoofing / tampering</text>
  <text x="728" y="804" class="small">Disclosure / DoS / EoP</text>
  <text x="728" y="824" class="small">Scenario packs</text>

  <rect x="1010" y="735" width="245" height="105" class="box tm"/>
  <text x="1038" y="762" class="label">Targeting Hints</text>
  <text x="1038" y="784" class="small">SAST, SCA, DAST</text>
  <text x="1038" y="804" class="small">Container, exploit hunt</text>
  <text x="1038" y="824" class="small">Ownership and evidence</text>

  <!-- Arrows -->
  <path d="M240 189 C300 189, 320 210, 365 214" class="arrow"/>
  <path d="M240 279 C300 279, 320 242, 365 232" class="arrow"/>
  <path d="M555 220 C610 220, 625 194, 680 192" class="arrow"/>
  <path d="M555 238 C610 260, 625 290, 680 302" class="arrow"/>
  <path d="M555 245 C620 280, 790 300, 845 302" class="arrow"/>
  <path d="M838 234 L838 370" class="arrow"/>
  <path d="M838 458 L838 500" class="arrow"/>
  <path d="M995 530 C1055 520, 1085 188, 1125 182" class="arrow"/>
  <path d="M995 540 C1055 535, 1085 294, 1125 292" class="arrow"/>
  <path d="M995 550 C1055 550, 1085 404, 1125 402" class="arrow"/>
  <path d="M995 560 C1055 565, 1085 514, 1125 512" class="arrow"/>

  <path d="M838 590 C760 650, 280 660, 205 735" class="arrow"/>
  <path d="M325 787 L390 787" class="arrow"/>
  <path d="M635 787 L700 787" class="arrow"/>
  <path d="M945 787 L1010 787" class="arrow"/>

  <!-- Risk labels -->
  <text x="292" y="177" class="risk">BT-01: untrusted HTTP input</text>
  <text x="585" y="183" class="risk">BT-02: facade routing</text>
  <text x="1015" y="173" class="risk">BT-04: DB boundary</text>
  <text x="1015" y="510" class="risk">BT-06: outbound boundary</text>
  <text x="715" y="482" class="risk">Unsafe-by-design module dispatch</text>

  <!-- Legend -->
  <rect x="40" y="915" width="18" height="18" class="box client"/><text x="66" y="929" class="tiny">Client</text>
  <rect x="130" y="915" width="18" height="18" class="box edge"/><text x="156" y="929" class="tiny">Facade</text>
  <rect x="225" y="915" width="18" height="18" class="box app"/><text x="251" y="929" class="tiny">Application</text>
  <rect x="335" y="915" width="18" height="18" class="box data"/><text x="361" y="929" class="tiny">Data/runtime</text>
  <rect x="475" y="915" width="18" height="18" class="box tm"/><text x="501" y="929" class="tiny">Threat modelling output</text>
</svg>
